services:
  sim:
    build:
      context: .
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    image: diffphys-sim:latest
    container_name: diffphys_ros2
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    env_file:
      - .env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/workspace/simulation
      - ../DiffPhysDrone:/workspace/DiffPhysDrone
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["bash", "-c", "while true; do sleep 1; done"]
